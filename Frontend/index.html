<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contratos Palmas</title>
    <link rel="stylesheet" href="./CSS/dashboard.css">
    <link rel="stylesheet" href="./CSS/crear.css">
    <link rel="stylesheet" href="./CSS/admin.css">
</head>
<body>
    <div class="dashboard">

        <!-- BARRA LATERAL -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="./Media/palmas_logo.png" alt="Logo Palmas">
            </div>

            <nav class="sidebar-nav">
                <a href="#/inicio" class="nav-item" data-ruta="inicio">
                    <span class="nav-icono">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>
                    </span>
                    Inicio
                </a>
                <a href="#/crear" class="nav-item" data-ruta="crear">
                    <span class="nav-icono">
                        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.8 9.94l-3.75-3.75L3 17.25zM20.7 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </span>
                    Creación
                </a>
                <a href="#/historial" class="nav-item" data-ruta="historial">
                    <span class="nav-icono">&#9776;</span>
                    Historial
                </a>
                <a href="#/admin" class="nav-item" data-ruta="admin" id="nav-admin" hidden>
                    <span class="nav-icono">
                        <svg viewBox="0 0 24 24" fill="currentColor"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
                    </span>
                    Modificar datos
                </a>
            </nav>

            <div class="sidebar-footer">
                <button id="btn-cerrar-sesion" class="btn-cerrar-sesion">Cerrar sesión</button>
            </div>
        </aside>

        <!-- CONTENIDO DINÁMICO -->
        <main class="principal" id="contenido"></main>

    </div>

    <div id="contenedor-toast" class="contenedor-toast"></div>

    <script src="./JS/app.js"></script>
</body>
</html>
